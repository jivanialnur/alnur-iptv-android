name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: |
          V=$(grep versionName app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk "out/AlnurIPTV-Tablet-$V.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          retention-days: 30
